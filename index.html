<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-2xl p-8 rounded-2xl shadow-lg">

        <h1 class="text-3xl font-bold text-blue-600 text-center mb-2">
            Student Sign Up
        </h1>

        <p class="text-gray-500 text-center mb-8">
            Create your student account
        </p>

        <form class="space-y-5">

            <div>
                <label class="block mb-2">Full Name</label>
                <input type="text" placeholder="Enter your name" required
                class="w-full border rounded-lg px-4 py-3">
            </div>

            <div>
                <label class="block mb-2">Email Address</label>
                <input type="email" placeholder="Enter your email" required
                class="w-full border rounded-lg px-4 py-3">
            </div>

            <div>
                <label class="block mb-2">Phone Number</label>
                <input type="tel" placeholder="Enter your phone number" required
                class="w-full border rounded-lg px-4 py-3">
            </div>

            <div>
                <label class="block mb-2">Date of Birth</label>
                <input type="date" required
                class="w-full border rounded-lg px-4 py-3">
            </div>

            <div>
                <label class="block mb-2">Gender</label>
                <select required class="w-full border rounded-lg px-4 py-3">
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div>
                <label class="block mb-2">Student ID</label>
                <input type="text" placeholder="Enter your student ID" required
                class="w-full border rounded-lg px-4 py-3">
            </div>

            <div>
                <label class="block mb-2">Department</label>
                <select required class="w-full border rounded-lg px-4 py-3">
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Software Engineering</option>
                    <option>Information Technology</option>
                    <option>Business Administration</option>
                </select>
            </div>

            <div>
                <label class="block mb-2">Password</label>
                <input type="password" placeholder="Enter password" required
                class="w-full border rounded-lg px-4 py-3">
            </div>

            <div>
                <label class="block mb-2">Confirm Password</label>
                <input type="password" placeholder="Confirm password" required
                class="w-full border rounded-lg px-4 py-3">
            </div>

            <button type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
                Create Account
            </button>

        </form>

        <p class="text-center mt-6">
            Already have an account?
            <a href="#" class="text-blue-600 font-semibold">Login</a>
        </p>

    </div>

</body>
</html>
